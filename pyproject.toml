[project]
name = "relayx"
version = "0.5.4"
description = "An OPSEC-aware NTLM relay exposure assessment, lab-calibrated validation, and controlled execution orchestration tool for authorized red teaming"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "RedteamNotes" }
]
keywords = [
  "ntlm",
  "relay",
  "red-team",
  "active-directory",
  "opsec",
  "security-assessment"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RedteamNotes/RelayX"
Repository = "https://github.com/RedteamNotes/RelayX"
Documentation = "https://github.com/RedteamNotes/RelayX/tree/main/docs"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.scripts]
relayx = "relayx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["relayx"]

[tool.hatch.build.targets.sdist]
include = [
  "relayx",
  "tests",
  "fixtures",
  "docs",
  "examples",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
